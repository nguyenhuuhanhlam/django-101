<div class="
    h-14
    px-6
    flex
    items-center
    justify-between
    bg-[#0f0f11]
    border-b
    border-[#1f1f23]
">

    <button
        x-show="!sidebarOpen"
        @click="sidebarOpen = true"
        class="
            mr-3
            flex
            items-center
            justify-center
            h-7
            w-7
            rounded-md
            hover:bg-white/5
        "
    >
        <i data-lucide="panel-left-open"></i>
    </button>

    <div class="
        flex
        items-center
        gap-2
    ">
        <i data-lucide="{{ header_icon|default:'building-2' }}" class="
            w-4
            h-4
            text-violet-500
        "></i>
        <span class="
            text-sm
            font-medium
            text-zinc-200
        ">
            {{ header_title|default:'Companies' }}
        </span>
    </div>

    <div class="
        flex
        items-center
        gap-1.5
    ">
        <button class="
            h-7
            px-2.5
            rounded
            border
            border-zinc-800
            text-xs
            text-zinc-300
            hover:bg-zinc-900
            transition-colors
            flex
            items-center
            gap-1.5
        ">
            <span>{{ header_button|default:'+ New Company' }}</span>
            <span class="text-zinc-700">|</span>
            <span class="text-zinc-500 text-[10px] font-mono">⌘K</span>
        </button>
        <button class="
            h-7
            w-7
            flex
            items-center
            justify-center
            rounded
            border
            border-zinc-800
            text-zinc-400
            hover:bg-zinc-900
            transition-colors
        ">
            <i data-lucide="more-horizontal" class="w-3.5 h-3.5"></i>
        </button>
    </div>

</div>
