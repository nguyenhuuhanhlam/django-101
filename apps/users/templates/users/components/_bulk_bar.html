{# ══════════════════════════════════════════════════════════════ #}
{# BULK ACTION BAR — hiện khi có ≥1 checkbox được chọn          #}
{# Biến Alpine dùng: selectedIds, bulkDelete()                  #}
{# ══════════════════════════════════════════════════════════════ #}
<div
    x-show="selectedIds.length > 0"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0 -translate-y-1"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-100"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 -translate-y-1"
    class="flex items-center gap-3 mb-2 px-3 py-2 rounded border border-violet-500/25 bg-violet-600/10 text-xs"
>
    <i data-lucide="check-square" class="w-3.5 h-3.5 text-violet-400 shrink-0"></i>
    <span class="text-violet-300 font-medium" x-text="`${selectedIds.length} selected`"></span>
    <div class="flex-1"></div>
    <button
        @click="bulkDelete()"
        class="flex items-center gap-1 text-rose-400 hover:text-rose-300 transition-colors"
    >
        <i data-lucide="trash-2" class="w-3 h-3"></i>
        Delete
    </button>
    <span class="text-zinc-700">·</span>
    <button
        @click="selectedIds = []"
        class="text-zinc-400 hover:text-zinc-200 transition-colors"
    >
        Cancel
    </button>
</div>
